# Import generated system colors
source = colors.conf

general {
    disable_loading_bar = true
    hide_cursor         = true
    grace               = 0
    immediate_render    = true
}

animations {
    enabled   = true
    animation = fadeIn,  1, 4, easeOutQuint
    animation = fadeOut, 1, 4, easeOutQuint
}

# ---------------------------------------------------------
# BACKGROUND (Wallpaper with premium blur & frosting)
# ---------------------------------------------------------
background {
    monitor     =
    path        = /home/scott/.cache/current_wallpaper.jpg
    blur_passes = 1
    blur_size   = 5
    noise       = 0.0117
    contrast    = 0.89
    brightness  = 0.65
    vibrancy    = 0.2
    vibrancy_darkness = 0.1
}

# ---------------------------------------------------------
# CLOCK & DATE (Traditional Korean Ink Paintbrush Calligraphy Theme)
# ---------------------------------------------------------

# Clock (Hours & Minutes)
label {
    monitor     =
    text        = cmd[update:1000] date '+%H:%M'
    color       = $tertiary
    font_size   = 150 # Massive elegant brush clock
    font_family = Nanum Brush Script # Korean paintbrush calligraphy font
    position    = 0, 410 # Raised higher to prevent overlap of large brush stroke heights
    halign      = center
    valign      = center
    shadow_passes = 2
    shadow_size   = 3
    shadow_color  = rgba(0, 0, 0, 0.3)
}

# Date (Traditional Korean Format: Year, Month, Day, Weekday)
label {
    monitor     =
    text        = cmd[update:43200000] date '+%Y년 %m월 %d일 %A'
    color       = $primary
    font_size   = 54 # Enlarged date scale to match clock
    font_family = Nanum Brush Script # Newly installed Korean ink brush calligraphy font
    position    = 0, 250 # Snuggly positioned above the card top
    halign      = center
    valign      = center
    shadow_passes = 1
    shadow_size   = 2
    shadow_color  = rgba(0, 0, 0, 0.2)
}

# ---------------------------------------------------------
# CENTRAL GLASS CARD CONTAINER (Borderless Pink Cyber Glow)
# ---------------------------------------------------------
shape {
    monitor     =
    size        = 460, 520 # Compact balanced dimensions for two elements
    color       = $secondary_card # Soft translucent secondary color tint
    rounding    = 36
    border_size = 0 # Completely removed solid border as requested
    position    = 0, -60 # Raised to balance screen canvas
    halign      = center
    valign      = center
    
    # Neon Pink Underglow fading into the background
    shadow_passes = 4
    shadow_size   = 25 # Soft, faded glow
    shadow_color  = $secondary_glow # Soft secondary color glow shadow
}

# ---------------------------------------------------------
# PROFILE AVATAR (220px + Magenta Cyberpunk Glow)
# ---------------------------------------------------------
image {
    monitor     =
    path        = ~/Bilder/sexy_me2.png
    size        = 220
    rounding    = -1 # Perfect circle
    border_size = 3
    border_color = $primary_glow # Dynamic primary border
    position    = 0, 40 # Re-centered inside the compact card
    halign      = center
    valign      = center
    
    # Neon Magenta Border Glow
    shadow_passes = 4
    shadow_size   = 12
    shadow_color  = $primary_glow # Hot primary glow
}

# ---------------------------------------------------------
# MODERN INPUT FIELD (375x68 Pill)
# ---------------------------------------------------------
input-field {
    monitor           =
    size              = 375, 68
    outline_thickness = 1
    rounding          = 34
    dots_size         = 0.2
    dots_spacing      = 0.4
    dots_center       = true
    outer_color       = rgba(255, 255, 255, 0.15)
    inner_color       = rgba(0, 0, 0, 0.25)
    font_color        = $on_surface
    check_color       = $primary # Dynamic primary active check color
    fail_color        = $error_container
    fade_on_empty     = false
    placeholder_text  = <span font_family="Noto Serif CJK KR" font_size="13" color="##ffffff80">비밀번호 입력...</span>
    fail_text         = <span font_family="Noto Serif CJK KR" font_size="13">비밀번호가 틀렸습니다 ($ATTEMPTS)</span>
    position          = 0, -130 # Re-spaced and balanced
    halign            = center
    valign            = center
}
