font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0
adjust_line_height  2
adjust_column_width 0
disable_ligatures never
font_features UnifontMedium +isol -medi -fina -init
cursor none
cursor_text_color #222222
cursor_shape block
cursor_trail 5
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 1
cursor_trail_color none
cursor_beam_thickness 1.5
cursor_underline_thickness 1.2
cursor_blink_interval 0.9
scrollback_lines 10000
remember_window_size  yes
window_padding_width 1
tab_bar_edge bottom
tab_bar_style fade
tab_bar_min_tabs 2
tab_powerline_style angled
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"
foreground #30f06f
background #000000
background_opacity 0.50
selection_foreground #2e2e2e
selection_background #cacaca
color0 #141414
color8 #454545
color1 #ee5403
color9 #f13f3f
color2  #19cb00
color10 #2ffd0f
color3  #cecb00
color11 #fffd20
color4  #3d73cc
color12 #1a8fff
color5  #cb1ed1
color13 #fd28ff
color6  #0dcdcd
color14 #14ffff
color7  #dddddd
color15 #ffffff
mark1_foreground black
mark1_background #98d3cb
mark2_foreground black
mark2_background #f2dcd3
mark3_background #f274bc
startup_session none
shell tmux
editor nvim
close_on_child_death no
allow_hyperlinks yes
shell_integration enabled
map ctrl+k    scroll_line_up
map ctrl+j    scroll_line_down
map cmd+h       scroll_page_up
map ctrl+l scroll_page_down
map ctrl+g scroll_home
map kitty_mod+g scroll_end
map kitty_mod+f5 load_config_file
map ctrl+>   load_config_file
map ctrl+1 send_text all \x1b[1;5q
map ctrl+2 send_text all \x1b[1;5r
map ctrl+3 send_text all \x1b[1;5s
map ctrl+4 send_text all \x1b[1;5t
