# Default tmux colors; Quickshell wallpaper updates regenerate this in ~/.tmux-colors.conf.
set -g status-style bg=default,fg=#e6ecf2
set -g status-left-length 100
set -g status-left "#[fg=#1670ca,bg=default]#[fg=#e6ecf2,bg=#1670ca,bold] #S#[fg=#1670ca,bg=default]"
set -g window-status-format "#[fg=#141414,bg=default]#[fg=#e6ecf2,bg=#141414]#I #W#[fg=#141414,bg=default]"
set -g window-status-current-format "#[fg=#1870ca,bg=default]#[fg=#e6ecf2,bg=#1870ca,bold]#I #W#[fg=#1870ca,bg=default]"
set -g status-right-length 100
set -g status-right "#[fg=#1970ca,bg=default]#[fg=#e6ecf2,bg=#1970ca,bold]󰃰 %H:%M#[fg=#1970ca,bg=default]"
set -g pane-border-style fg=#141414
set -g pane-active-border-style fg=#1670ca
