# -----------------------------------------------------------------------------
# Tmux configuration
# -----------------------------------------------------------------------------

# Prefix: Ctrl+S
set -g prefix C-s
unbind C-b
bind C-s last-pane

set -g update-environment "DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE"
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded"

# Allow the terminal emulator to set the title.
set -g set-titles on
set -g set-titles-string "#T"

# True color support.
set -g default-terminal "xterm-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g history-limit 10000
set -g aggressive-resize on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set-window-option -g mode-keys vi

# Copy mode and clipboard buffer.
bind C-v copy-mode
bind p paste-buffer

# Pane resizing and navigation.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind C-h select-pane -L
bind C-j select-pane -D
bind C-k select-pane -U
bind C-l select-pane -R

# Switch windows without the prefix.
bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5
bind -n C-6 select-window -t 6
bind -n C-7 select-window -t 7
bind -n C-8 select-window -t 8
bind -n C-9 select-window -t 9
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-o copy-mode

# Splitting, preserving the current working directory.
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind %
unbind '"'

set -g mouse on
set -g status-position top
set -g status-justify left
source-file ~/.tmux-colors.conf

# TPM plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
if-shell '[ -x "$HOME/.tmux/plugins/tpm/tpm" ]' 'run-shell "$HOME/.tmux/plugins/tpm/tpm"'
if-shell '[ -x /usr/share/tmux-plugin-manager/tpm ]' 'run-shell /usr/share/tmux-plugin-manager/tpm'
